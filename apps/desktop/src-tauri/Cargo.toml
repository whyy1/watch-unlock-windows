[package]
name = "watch-unlock-desktop"
version = "0.2.7"
description = "Local desktop interface for Watch Unlock"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.90"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
strip = true
lto = "thin"
